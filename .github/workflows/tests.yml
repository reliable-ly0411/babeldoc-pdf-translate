name: Adapter and runtime regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/dsh_chat.mjs
      - run: python -m pip install -r requirements.txt
      - run: python scripts/repair_runtime.py --apply
      - run: python scripts/repair_runtime.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sync_plugin_skill.py --check
      - run: python scripts/repair_runtime.py --rollback
      - run: python scripts/repair_runtime.py --apply
